<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metro Arrivals</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-polylineoffset@1.1.1/leaflet.polylineoffset.js"></script>
</head>
<body>
  <div class="app">
    <div id="map" aria-label="Metro map"></div>

    <aside id="panel">
      <header class="panel-header">
        <h1 class="brand"><span class="brand-mark">M</span> Metro Arrivals</h1>
        <div class="combo" id="station-search">
          <input type="search" class="combo-input" placeholder="Search stations" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-autocomplete="list" aria-label="Search stations">
          <ul class="combo-list" role="listbox" hidden></ul>
        </div>
      </header>

      <section class="station-card" aria-labelledby="station-name">
        <div class="station-title">
          <h2 id="station-name">&nbsp;</h2>
          <div id="station-lines" class="line-badges"></div>
        </div>
        <div class="station-meta">
          <span id="updated" class="muted"></span>
          <button id="refresh" class="icon-button" type="button" aria-label="Refresh arrivals" title="Refresh">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
        </div>
      </section>

      <section class="section" aria-label="Arrivals">
        <div id="arrivals" aria-live="polite"></div>
      </section>

      <section class="section">
        <details id="alerts" class="notice">
          <summary><span class="notice-icon" aria-hidden="true"></span><span class="notice-text">Rail alerts</span></summary>
          <div class="notice-body"></div>
        </details>
        <details id="outages" class="notice">
          <summary><span class="notice-icon" aria-hidden="true"></span><span class="notice-text">Elevator &amp; escalator outages</span></summary>
          <div class="notice-body"></div>
        </details>
      </section>

      <section class="section">
        <details id="trip" class="card" open>
          <summary class="card-title">Trip planner</summary>
          <div class="trip-fields">
            <div class="combo" id="trip-from">
              <label class="field-label">From</label>
              <input type="search" class="combo-input" placeholder="Start station" autocomplete="off"
                     role="combobox" aria-expanded="false" aria-autocomplete="list" aria-label="From station">
              <ul class="combo-list" role="listbox" hidden></ul>
            </div>
            <button id="trip-swap" class="icon-button swap" type="button" aria-label="Swap stations" title="Swap">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3 5 6.99h3V14h2V6.99h3L9 3z"/></svg>
            </button>
            <div class="combo" id="trip-to">
              <label class="field-label">To</label>
              <input type="search" class="combo-input" placeholder="End station" autocomplete="off"
                     role="combobox" aria-expanded="false" aria-autocomplete="list" aria-label="To station">
              <ul class="combo-list" role="listbox" hidden></ul>
            </div>
          </div>
          <div id="trip-result" aria-live="polite"></div>
        </details>
      </section>

      <footer class="panel-footer muted">Data from the WMATA API. Not affiliated with WMATA.</footer>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
