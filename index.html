<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metro Arrivals</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
  <div id="map"></div>

  <main>
    <h1>Next trains</h1>

    <form id="station-form">
      <label for="station">Station</label>
      <select id="station"><option value="">Loading…</option></select>
      <button type="submit">Refresh</button>
    </form>

    <p id="message" class="muted"></p>

    <table>
      <thead>
        <tr>
          <th>Line</th>
          <th>Destination</th>
          <th>Station</th>
          <th>Minutes</th>
        </tr>
      </thead>
      <tbody id="train-rows"></tbody>
    </table>

    <div class="incidents">
      <h2>Rail alerts</h2>
      <div id="incident-list"><span class="none">No alerts.</span></div>
    </div>

    <div class="incidents">
      <h2>Elevator &amp; escalator outages</h2>
      <div id="elevator-list"><span class="none">No outages.</span></div>
    </div>

    <section class="trip-planner">
      <h2>Trip planner</h2>
      <form id="trip-form">
        <label for="trip-from">From</label>
        <select id="trip-from"><option value="">Loading…</option></select>
        <label for="trip-to">To</label>
        <select id="trip-to"><option value="">Loading…</option></select>
        <button type="submit">Get fare &amp; time</button>
      </form>
      <div id="trip-result"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
